# IIS Node.js Configuration for PR Reviewer Bot
# This file contains iisnode-specific settings for optimal performance on Windows Server

# Node.js process management
nodeProcessCountPerApplication: 1
maxConcurrentRequestsPerProcess: 1024
maxNamedPipeConnectionRetry: 3
namedPipeConnectionRetryDelay: 2000

# Logging configuration
loggingEnabled: true
logDirectoryNameSuffix: logs
debuggingEnabled: false
devErrorsEnabled: false

# Performance settings
node_env: production
enableXFF: true

# Process recycling
recycleSignalEnabled: false
idlePageOutTimePeriod: 0

# Request handling
initialRequestBufferSize: 4096
maxRequestBufferSize: 65536

# File watching (for development - disable in production)
watchedFiles: "*.js;node_modules\*;*.json"
uncFileChangesPollingInterval: 5000

# Graceful shutdown
gracefulShutdownTimeout: 60000

# Security
promoteServerVars: "LOGON_USER,AUTH_USER,AUTH_TYPE,REMOTE_USER"
